; Dorky Commander firmware — ESP32-C6-SuperMini
;
; Environments:
;   esp32-c6                Production firmware (ESP-IDF) for the Dorky C6 board.
;   t2can-fd                Same firmware for the LilyGo T-2CAN FD (ESP32-S3).
;   tests-native            Host unit tests (no hardware).
;                           `pio test -e tests-native`.
;   tests-native-berry      Host tests that run the real Berry VM against
;                           stubbed hardware. `pio test -e tests-native-berry`.
;   esp32-c6-tests-arduino  On-device hardware smoke tests (Arduino, not
;                           sharing production code).
;                           `pio test -e esp32-c6-tests-arduino`.
;
; Note: the pioarduino platform fork is required for ESP32-C6 + TWAI v2 API
; support. It provides both the Arduino and ESP-IDF frameworks.

[platformio]
build_cache_dir = .cache
default_envs = esp32-c6

[env]
; Platform version and PlatformIO Core must stay in sync: 55.03.312 needs
; Core >= 6.2.0 (it ships tool-scons 4.41101.0). An older Core fails with
; IncompatiblePlatform, or — if engines still pass — the tool-scons
; 'SCons.Tool.FortranCommon' bug. Upgrade: pip install -U "platformio>=6.2.0".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
upload_speed = 921600
monitor_speed = 115200
; hmm, not sure if this works on Linux properly, but it supposed to prevent board resetting when opening serial monitor
monitor_dtr = 0
monitor_rts = 0

; ---------- production firmware (ESP-IDF, release) ----------
[env:esp32-c6]
board = esp32-c6-devkitm-1
framework = espidf

; GCC 14+ in esp-idf 6 defines __riscv_misaligned_slow=1 for rv32imc, which makes
; newlib's RISC-V memcpy use word loads from unaligned flash pointers
; (load access fault). Undefining forces the alignment-check fallback;
; safe for all toolchains, no perf hit on aligned copies.
build_flags =
  -U__riscv_misaligned_slow
  -DBOARD_DORKY_C6

board_upload.flash_size = 4MB ; ESP32-C6-SuperMini module has 4 MB
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
extra_scripts =
  pre:tools/sync_submodules.py
  pre:tools/version.py
  pre:tools/sdkconfig_freshness.py
; Production firmware has no tests of its own — they live in the test envs.
; Without this, `pio test` tries to compile Arduino-only test files against
; the ESP-IDF build and fails with missing <Arduino.h>.
test_ignore = *

; ---------- LilyGo T-2CAN FD (ESP32-S3 + MCP2518FD) ----------
; Same application sources. -DBOARD_T2CAN_FD selects firmware/src/board/board_t2can_fd.h.
; Bus 0 (vehicle CAN) is the MCP2518FD; bus 1 (chassis CAN) is the S3 TWAI.
[env:t2can-fd]
board = esp32-s3-devkitc1-n16r8
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions-16mb.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.t2can-fd
; Optional: -DDORKY_DEBUG_DEFAULT=1 starts with the persistent debug flag
; on when NVS has no saved value (still toggleable at runtime).
build_flags =
  -DBOARD_T2CAN_FD
extra_scripts =
  pre:tools/sync_submodules.py
  pre:tools/version.py
  pre:tools/sdkconfig_freshness.py
test_ignore = *

; ---------- same firmware with debug symbols + gdb ready ----------
; Separate env for faster switching
;   pio run -e esp32-c6-debug -t upload   # flash debug build, no GDB needed
;   pio debug -e esp32-c6-debug           # actually attach GDB
[env:esp32-c6-debug]
extends = env:esp32-c6
; Use the C6's built-in USB-Serial-JTAG for gdb, instead of default CMSIS-DAP (which ; requires external probe)
debug_tool = esp-builtin
build_type = debug
build_flags =
  ${env:esp32-c6.build_flags}
  -D DORKY_DEBUG_BUILD=1
  -D BE_DEBUG=1

; ---------- hardware smoke tests (Arduino) ----------
[env:esp32-c6-tests-arduino]
board = esp32-c6-devkitm-1
framework = arduino
test_framework = unity
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
test_speed = 115200
; Each test env owns one suite prefix and hard-skips the other two:
; test_hw_* on device, test_native_* for plain host tests, test_berry_* for
; host tests that link the Berry VM. test_ignore wins even when the VSCode
; Test Explorer forces a suite with `-f`, so a mistargeted run is a no-op
; instead of a broken build.
test_ignore = test_native_*, test_berry_*

; ---------- host unit tests ----------
[env:tests-native]
platform = native
test_framework = unity
test_ignore = test_hw_*, test_berry_*
build_flags =
  -Wall
  -Wextra
  -Icomponents/acan2517fd/src

; Berry VM + scripting bindings on the host. Kept apart from tests-native so
; only this env pulls in the vendored VM and the stub headers.
[env:tests-native-berry]
extends = env:tests-native
test_ignore = test_hw_*, test_native_*
extra_scripts = pre:tools/build_berry_native.py